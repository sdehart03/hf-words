<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sight Words Flashcards</title>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Animation utilities */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-in {
            animation: fadeIn 0.3s ease-out;
        }
        .slide-in-from-bottom-4 {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Inline SVGs to remove external dependencies) ---
        const IconWrapper = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const Volume2 = (props) => (
            <IconWrapper {...props}>
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </IconWrapper>
        );

        const ArrowRight = (props) => (
            <IconWrapper {...props}>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </IconWrapper>
        );

        const ArrowLeft = (props) => (
            <IconWrapper {...props}>
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </IconWrapper>
        );

        const Shuffle = (props) => (
            <IconWrapper {...props}>
                <polyline points="16 3 21 3 21 8"></polyline>
                <line x1="4" y1="20" x2="21" y2="3"></line>
                <polyline points="21 16 21 21 16 21"></polyline>
                <line x1="15" y1="15" x2="21" y2="21"></line>
                <line x1="4" y1="4" x2="9" y2="9"></line>
            </IconWrapper>
        );

        const RotateCcw = (props) => (
            <IconWrapper {...props}>
                <path d="M1 4v6h6"></path>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </IconWrapper>
        );

        const ListIcon = (props) => (
            <IconWrapper {...props}>
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </IconWrapper>
        );

        const GridIcon = (props) => (
            <IconWrapper {...props}>
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </IconWrapper>
        );


        // --- Main App Component ---
        const Flashcards = () => {
            const initialWords = [
                "am", "I", "a", "the", "an", "and", "as", "of", "go", "no", "so", "do", "my", "to", "into", 
                "said", "not", "that", "he", "me", "she", "are", "as", "you", "see", "was", "for", "or", 
                "her", "his", "this", "with", "your", "good", "look", "all", "says", "they", "each", "like", 
                "little", "from", "have", "more", "about", "out", "put", "be", "get", "very", "what", "when", 
                "who", "does", "goes", "only", "other", "off", "which", "again", "day", "say", "by", "my", 
                "try", "why", "first", "friend", "half", "any", "many", "pretty", "front", "know", "two", 
                "draw", "saw", "talk", "walk", "come", "love", "some", "happen", "listen", "often", "problem", 
                "funny", "myself", "open", "here", "there", "where", "write", "their", "these", "those", "blue", 
                "true", "use", "done", "gone", "once", "one", "could", "should", "would", "almost", "both", 
                "children", "wind", "before", "course", "heart", "four", "yours", "color", "earth", "word", 
                "work", "world", "another", "brother", "father", "mother", "during", "learn", "sure", "against", 
                "break", "eight", "great", "above", "nothing", "people", "been", "carry", "please", "by", 
                "bye", "type", "because", "busy", "family", "ahead", "around", "away", "early", "heavy", 
                "instead", "ready"
            ];

            const cardColors = [
                "bg-red-100 text-red-800 border-red-200",
                "bg-orange-100 text-orange-800 border-orange-200",
                "bg-amber-100 text-amber-800 border-amber-200",
                "bg-yellow-100 text-yellow-800 border-yellow-200",
                "bg-lime-100 text-lime-800 border-lime-200",
                "bg-green-100 text-green-800 border-green-200",
                "bg-emerald-100 text-emerald-800 border-emerald-200",
                "bg-teal-100 text-teal-800 border-teal-200",
                "bg-cyan-100 text-cyan-800 border-cyan-200",
                "bg-sky-100 text-sky-800 border-sky-200",
                "bg-blue-100 text-blue-800 border-blue-200",
                "bg-indigo-100 text-indigo-800 border-indigo-200",
                "bg-violet-100 text-violet-800 border-violet-200",
                "bg-purple-100 text-purple-800 border-purple-200",
                "bg-fuchsia-100 text-fuchsia-800 border-fuchsia-200",
                "bg-pink-100 text-pink-800 border-pink-200",
                "bg-rose-100 text-rose-800 border-rose-200",
            ];

            const [words, setWords] = useState(initialWords);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [viewMode, setViewMode] = useState('card');
            const [isSpeaking, setIsSpeaking] = useState(false);

            const getColor = (index) => cardColors[index % cardColors.length];

            const speakWord = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.rate = 0.9;
                    utterance.pitch = 1.1;
                    utterance.lang = 'en-US';
                    
                    utterance.onstart = () => setIsSpeaking(true);
                    utterance.onend = () => setIsSpeaking(false);
                    utterance.onerror = () => setIsSpeaking(false);
                    
                    window.speechSynthesis.speak(utterance);
                }
            };

            const nextCard = () => {
                setCurrentIndex((prev) => (prev + 1) % words.length);
            };

            const prevCard = () => {
                setCurrentIndex((prev) => (prev - 1 + words.length) % words.length);
            };

            const shuffleCards = () => {
                const shuffled = [...words].sort(() => Math.random() - 0.5);
                setWords(shuffled);
                setCurrentIndex(0);
            };

            const resetOrder = () => {
                setWords(initialWords);
                setCurrentIndex(0);
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (viewMode === 'card') {
                        if (e.key === 'ArrowRight' || e.key === ' ') {
                            e.preventDefault();
                            nextCard();
                        } else if (e.key === 'ArrowLeft') {
                            prevCard();
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            speakWord(words[currentIndex]);
                        }
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [currentIndex, words, viewMode]);

            return (
                <div className="min-h-screen flex flex-col items-center p-4 font-sans text-slate-800">
                    
                    {/* Header */}
                    <header className="w-full max-w-2xl flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h1 className="text-3xl font-bold text-slate-700 tracking-tight">Sight Words</h1>
                        
                        <div className="flex bg-white p-1 rounded-lg shadow-sm border border-slate-200">
                            <button
                                onClick={() => setViewMode('card')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-md transition-all ${
                                    viewMode === 'card' 
                                        ? 'bg-blue-100 text-blue-700 font-medium' 
                                        : 'text-slate-500 hover:bg-slate-50'
                                }`}
                            >
                                <GridIcon size={18} />
                                Cards
                            </button>
                            <button
                                onClick={() => setViewMode('list')}
                                className={`flex items-center gap-2 px-4 py-2 rounded-md transition-all ${
                                    viewMode === 'list' 
                                        ? 'bg-blue-100 text-blue-700 font-medium' 
                                        : 'text-slate-500 hover:bg-slate-50'
                                }`}
                            >
                                <ListIcon size={18} />
                                List
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="w-full max-w-2xl flex-1 flex flex-col">
                        
                        {viewMode === 'card' ? (
                            // CARD VIEW
                            <div className="flex flex-col items-center w-full animate-in">
                                
                                <div className="w-full flex justify-between text-sm font-medium text-slate-400 mb-2 px-2">
                                    <span>Card {currentIndex + 1} of {words.length}</span>
                                    <span>{Math.round(((currentIndex + 1) / words.length) * 100)}% Complete</span>
                                </div>

                                <div 
                                    className={`
                                        relative w-full aspect-[4/3] md:aspect-[16/9] 
                                        flex flex-col justify-center items-center 
                                        rounded-3xl shadow-xl border-4 transition-all duration-300 transform
                                        ${getColor(currentIndex)}
                                        cursor-pointer hover:shadow-2xl hover:scale-[1.01]
                                    `}
                                    onClick={() => speakWord(words[currentIndex])}
                                >
                                    <span className="text-7xl md:text-9xl font-bold tracking-wide select-none drop-shadow-sm text-center">
                                        {words[currentIndex]}
                                    </span>
                                    
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); speakWord(words[currentIndex]); }}
                                        className={`
                                            absolute bottom-6 right-6 p-4 rounded-full bg-white/50 hover:bg-white 
                                            text-slate-700 transition-all shadow-sm
                                            ${isSpeaking ? 'scale-110 ring-4 ring-blue-400/30' : ''}
                                        `}
                                        title="Read Aloud (Spacebar)"
                                    >
                                        <Volume2 size={32} className={isSpeaking ? "animate-pulse" : ""} />
                                    </button>

                                    <div className="absolute top-6 left-6 text-black/20 font-bold text-xl opacity-50">
                                        #{currentIndex + 1}
                                    </div>
                                    
                                    <div className="absolute bottom-6 left-1/2 transform -translate-x-1/2 text-black/20 text-sm font-medium opacity-60">
                                        Tap card to listen
                                    </div>
                                </div>

                                <div className="flex items-center justify-between w-full mt-8 gap-4">
                                    <button 
                                        onClick={prevCard}
                                        className="flex-1 p-4 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors flex justify-center items-center gap-2 group"
                                    >
                                        <ArrowLeft className="group-hover:-translate-x-1 transition-transform" />
                                        Previous
                                    </button>
                                    
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={shuffleCards}
                                            className="p-4 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-purple-50 hover:text-purple-600 transition-colors"
                                            title="Shuffle Words"
                                        >
                                            <Shuffle />
                                        </button>
                                        <button 
                                            onClick={resetOrder}
                                            className="p-4 rounded-xl bg-white border border-slate-200 shadow-sm text-slate-600 hover:bg-orange-50 hover:text-orange-600 transition-colors"
                                            title="Reset Order"
                                        >
                                            <RotateCcw />
                                        </button>
                                    </div>

                                    <button 
                                        onClick={nextCard}
                                        className="flex-1 p-4 rounded-xl bg-blue-600 text-white shadow-md hover:bg-blue-700 hover:shadow-lg transition-all flex justify-center items-center gap-2 group"
                                    >
                                        Next
                                        <ArrowRight className="group-hover:translate-x-1 transition-transform" />
                                    </button>
                                </div>
                                
                                <p className="mt-8 text-slate-400 text-sm text-center">
                                    Tip: Use Left/Right arrow keys to navigate, Up arrow to speak.
                                </p>

                            </div>
                        ) : (
                            // LIST VIEW
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 w-full animate-in slide-in-from-bottom-4">
                                <div className="flex justify-between items-center mb-4 pb-4 border-b border-slate-100">
                                    <h2 className="text-xl font-bold text-slate-700">Word List ({words.length})</h2>
                                    <div className="flex gap-2">
                                        <button onClick={shuffleCards} className="text-sm px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-md text-slate-600 transition-colors">
                                            Shuffle
                                        </button>
                                        <button onClick={resetOrder} className="text-sm px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-md text-slate-600 transition-colors">
                                            Reset
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 max-h-[65vh] overflow-y-auto pr-2 custom-scrollbar">
                                    {words.map((word, idx) => (
                                        <button
                                            key={`${word}-${idx}`}
                                            onClick={() => {
                                                setCurrentIndex(idx);
                                                setViewMode('card');
                                            }}
                                            className={`
                                                p-3 rounded-lg text-lg font-medium text-center transition-all
                                                ${currentIndex === idx ? 'ring-2 ring-blue-500 ring-offset-1' : ''}
                                                ${getColor(idx)} hover:brightness-95
                                            `}
                                        >
                                            {word}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Flashcards />);
    </script>
</body>
</html>
